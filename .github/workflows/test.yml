name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 是 dict|None 之类语法的下限；跑一遍最新的防将来的行为变化
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      # v4/v5 跑在被弃用的 Node 20 上，每次 run 三条 warning；v7 系已出，顺手升掉
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install requests
      - run: python -m unittest discover -v

  # README 承诺 server 核心（tg_rich_mcp/tg_sticker/tg_ask/secret_redaction）
  # 全平台——这档就是那句承诺的看门人。进度窗 hook 是 Unix-only（fcntl），
  # 测试侧靠 @needs_hook 在 Windows 上自动跳过，不算食言。
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m unittest discover -v
